[project]
name = "finreport"
version = "0.1.0"
description = "Annual-report financial statement extraction with review UI"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "reportlab>=4.0",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finreport = ["../web/*", "../web/static/*"]
